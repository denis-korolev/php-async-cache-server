services:
    cache-app-cli:
        build:
            context: docker
            dockerfile: development/php-cli/Dockerfile
        tty: true
        stdin_open: true
        volumes:
            - .:/app
        ports:
            - ${GATEWAY_PORT}:777
            - ${SERVER_PORT}:778
            - 779:779
            - 780:780
        env_file:
            - .env